spring.application.name=vocam-backend

# ── Database Configuration (Loaded strictly from .env) ───────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA ──────────────────────────────────────────────────────
# Flyway manages schema — JPA only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# Supabase JWTs are verified with the project's JWT secret. This value is
# intentionally required; there is no insecure built-in fallback secret.
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER}
supabase.jwt.audience=${SUPABASE_JWT_AUDIENCE:authenticated}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Reject unexpectedly large uploads before forwarding them to the AI service.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# ── Server (Loaded strictly from .env) ────────────────────────
server.port=${PORT}

# ── Logging ──────────────────────────────────────────────────
logging.level.org.englishapp=INFO
logging.level.org.flywaydb=INFO
